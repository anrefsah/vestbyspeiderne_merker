}, {
  "id": "tolk",
  "namn": "Tolk",
  "type": "speider",
  "omrader": ["K", "V"],
  "mal": ["K-2", "V-11", "V-4"],
  "krav": ["Hold regelmessig kontakt med en utenlandsk ungdom (ikke skandinavisk) i minst ett år, eller delta på en leir med utenlandske speidere i et annet land (ikke skandinavisk).", "Delta på JOTA eller JOTI, og gjennomfør en samtale/chat med en speider fra et land utenfor Skandinavia, der du forteller om hjemstedet ditt, speidergruppa di og deg selv.", "Øv deg på å føre en alminnelig samtale om hjemstedet ditt, dagligliv, severdigheter og hvordan man skal finne frem, på et ikke-skandinavisk språk. Gjennomfør en samtale med en utenlandsk speider eller en annen som besøker Norge.", "Les og oversett et stykke om forholdene i et annet ikke-skandinavisk land."],
  "alderstrinn": "vandrer",
  "kategori": "hjemme",
  "uid": "tolk",
  "url": "https://speiding.no/speiderprogram/speiderbasen/tolk/"
}, {
  "id": "verdensvennskap",
  "namn": "Verdensvennskap",
  "type": "speider",
  "omrader": ["L", "S", "V"],
  "mal": ["L-1", "S-13", "V-11"],
  "krav": ["Tegn begge verdensmerkene, og forklar patruljen hva symbolene i merkene står for.", "Hvilke felles markeringsdager har speidere over hele verden? Ta for deg en av dagene og finn ut hvordan denne markeres i tre forskjellige land (minst ett land utenfor Norden).", "Bli kjent med en speider fra et land utenfor Norden. Finn likheter og ulikheter mellom speiderarbeidet i dette landet og Norge.", "Gjør rede for hva som skiller speiderarbeidet i Norge fra speiderarbeidet i andre land (hva er typisk norsk?).", "Lag en enkel presentasjon som forteller noe om speidingens historie.", "(Velg 2 av 5) Løs to av disse oppgavene: Fortell de andre i patruljen hvorfor Lord Baden-Powell startet speiderbevegelsen? Dramatiser sangen «Lord Baden-Powell i England satt» Lær noen Lord Baden-Powell-sitater. Les en bok av eller om Baden-Powell og speiding. Finn fram til hjemmesidene til og lag en veggplansje eller lignende som forteller om WOSM og WAGGG, og undersøk hvordan disse organisasjonene er bygd opp, og hva de arbeider med."],
  "alderstrinn": "vandrer",
  "kategori": "hjemme",
  "uid": "verdensvennskap",
  "url": "https://speiding.no/speiderprogram/speiderbasen/verdensvennskap/"
}, {
  "id": "journalist-0",
  "namn": "Journalist",
  "type": "patrulje",
  "omrader": ["S", "V"],
  "mal": ["S-2", "V-4"],
  "krav": ["Sett deg inn i «Vær varsom reglene» for journalister. Les en artikkel som står skrevet i en lokalavis, riksavis, i et ungdomsmagasin eller et ukeblad. Oppfyller de kravene til «Vær varsom reglene»?", "Skriv en reportasje/leserinnlegg fra et speiderarrangement eller noe annet som opptar deg.", "Send en artikkel til lokalavisen eller få den trykt i «Speideren».", "Besøk lokalavisa, nærradiostasjonen, lokal TV-stasjonen eller NRK sitt distriktskontor. Finn ut mest mulig om hva som skjer fra starten på en reportasje til den er ferdig trykket eller har gått «på lufta». Husk å avtale besøket med avisa eller radio-/TV stasjonen på forhånd."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "journalist-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/journalist-0/"
}, {
  "id": "verden-og-vi-0",
  "namn": "Verden og vi",
  "type": "patrulje",
  "omrader": ["S", "V"],
  "mal": ["S-12", "S-13", "S-9", "V-7"],
  "krav": ["Sett dere inn i hva som menes med rettferdig handel (Fairtrade), og finn noen eksempler på rettferdige produkter. Hvordan kan vi som forbrukere bidra til at rettferdige produkter blir mer utbredt? Finn ut hvor og under hvilke forhold klærne du eier er produsert, og hvor mye lønn arbeiderne får.", "Undersøk om speidergruppa har en bevisst praksis rundt miljø og rettferdig handel, og ta initiativ til forbedringstiltak.", "Finn ut mer om maktforholdet mellom rike og fattige land, og hvordan det kommer til uttrykk gjennom handel mellom land, internasjonale avtaler, bistands- og utviklingsarbeid og u-landsgjeld.", "Sammenlign speiderarbeidet i Norge og 1-2 ikke-vestlige land.", "Inviter en person fra et annet land for å fortelle om landet sitt, for eksempel historie, kultur, økonomien, familieforholdene og naturen. Hvordan opplever dere kulturelle forskjeller og likheter mellom Norge og landet?"],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "verden-og-vi-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/verden-og-vi-0/"
}, {
  "id": "natur-og-miljovern-1",
  "namn": "Natur- og miljøvern",
  "type": "patrulje",
  "omrader": ["S"],
  "mal": ["S-3", "S-4", "S-6", "S-7", "S-8"],
  "krav": ["(Velg 2 av 3) Transport (to av tre oppgaver må gjennomføres): Lag et oppslag til å henge på veggen, der du/dere gjør rede for hvordan transport påvirker miljøet, både i lokal, nasjonal og global målestokk; Gå/sykle til alle speidermøter og turer i 3 måneder. Hvis avstanden er over 3 km, kan kollektiv transport benyttes; Reis på minst en tur der dere benytter sykkel som fremkomstmiddel.", "(Velg 2 av 3) Ressurser (to av tre oppgaver må gjennomføres): Lag et oppslag til å henge på veggen, der du/dere gjør rede for begrepene «fornybare ressurser» og «ikke-fornybare ressurser» med eksempler. Finn ut hvor lenge de ikke-fornybare ressursene vil vare med den bruk vi har i dag. Gi eksempler på hvordan ressurser kan gjenvinnes. Kan troppen gjøre noe med dette? Få en omvisning på et (inter)kommunalt gjenvinningsanlegg, og finn ut hva som skjer med innlevert avfall; Gjør dere kjent med kommunens kildesorteringsordninger. Undersøk om din egen familie benytter seg av alle ordningene som tilbys. Hvis ikke: hjelp til hjemme, slik at dere benytter dere av alle ordningene som tilbys.", "(Velg 1 av 2) Prosjekter (en av de to oppgavene må gjennomføres): Delta på et natur- eller miljøvernprosjekt i regi av en annen organisasjon på hjemstedet ditt/deres. Inviter organisasjonen på et troppsmøte før arrangementet, for å få bakgrunnsinfo om prosjektet; Sett i gang troppens eget natur- eller miljøvernprosjekt.", "Økologi: Illustrer en enkel næringskjede. Hva kan skje dersom et av leddene i kjeden blir skadet eller forsvinner? Lag en oversikt over dyr eller planter i ditt distrikt som står i fare for å bli utryddet. Forklar hvorfor. Er det noe troppen kan gjøre med dette?"],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "natur-og-miljovern-1",
  "url": "https://speiding.no/speiderprogram/speiderbasen/natur-og-miljovern-1/"
}, {
  "id": "flerkulturell-0",
  "namn": "Flerkulturell",
  "type": "speider",
  "omrader": ["S", "V"],
  "mal": ["S-11", "S-13", "V-12"],
  "krav": ["Finn ut hvilke 5 nasjonaliteter det kommer flest mennesker fra på ditt hjemsted.", "Prøv å finne ut om det finnes noen flyktning- eller innvandrerorganisasjon på ditt hjemsted, og hva slags aktiviteter de driver med og for hvem.", "Inviter medlemmer fra en slik organisasjon med på et speidermøte eller en speidertur."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "flerkulturell-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/flerkulturell-0/"
}, {
  "id": "god-torn-0",
  "namn": "God tørn",
  "type": "speider",
  "omrader": ["L", "S"],
  "mal": ["L-5", "S-11", "S-3", "S-4"],
  "krav": ["(Velg 2 av 5) Gjør en tjeneste for en annen person (minst 2 måneder for stifinnere og 3 måneder for vandrere). F.eks: være pasientvenn/besøksvenn gjennom Røde Kors være flyktningguide holde en natursti ren være med på vedaksjon rydde, male, bære ved, vaske og lignende hos noen som trenger det.", "Vær aktiv med i en aksjon for å hjelpe medmennesker i ditt nærmiljø.", "Vær aktiv med i en aksjon for å hjelpe medmennesker i et annet land.", "Ta ansvar for opprydning og vask etter en tur/leir og et troppsmøte."],
  "alderstrinn": "vandrer",
  "kategori": "hjemme",
  "uid": "god-torn-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/god-torn-0/"
}, {
  "id": "fn",
  "namn": "FN",
  "type": "speider",
  "omrader": ["S", "V"],
  "mal": ["S-1", "S-11", "S-5", "V-12"],
  "krav": ["Finn ut hva FN står for og hvordan den er organisert.", "Finn informasjon om barnekonvensjonen og les om barn og unges rettigheter. Lag en liste over de rettighetene som er viktigst for deg. Bruk et patruljemøte eller deler av et troppsmøte til å diskutere dette i patruljen. Er barns rettigheter godt ivaretatt i Norge?", "Gjør dere kjent med FNs bærekraftsmål. Ta for dere troppens terminliste og se på hvordan dere kan jobbe med bærekraftsmålene.", "Skriv et brev til Statsministeren i Norge om hvordan det er å være barn i Norge og hvordan du mener Norge kan bli et enda bedre sted for barn."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "fn",
  "url": "https://speiding.no/speiderprogram/speiderbasen/fn/"
}, {
  "id": "naermiljo-0",
  "namn": "Nærmiljø",
  "type": "speider",
  "omrader": ["S"],
  "mal": ["S-11", "S-14", "S-3"],
  "krav": ["Finn beliggenheten til nærmeste brannstasjon, politistasjon, lege, sykehus, legevakt, apotek, postkontor, hotell, kirke, skole og bibliotek. Finn også ut hvor noen lokale severdigheter ligger. Demonstrer dette ved at du på en enkel måte forklarer en fremmed veien.", "Lag et kart over viktige veier, gater og stier, samt vann, elver, hus og lignende, innenfor en radius av en kilometer fra speiderhuset, patruljestedet eller et annet sted.", "(Velg 1 av 6) Lag en hjemstedsbok med følgende opplysninger: geologi, dyre- og planteliv historie, folkeminner og stedsnavn historiske minnesmerke næringslivet kirkens historie ulike turmål med en kort presentasjon", "Velg en aktuell sak i kommunen eller nærmiljøet, og følg denne saken til avgjørelse er tatt. Lag en utstilling med avisutklipp, intervjuer, bilder og annet.", "Delta på Rusken-aksjon/strandryddedag eller et annet prosjekt hvor du kan hjelpe til med å rydde/ordne for nærmiljøet.", "Arranger en tur for patruljen eller troppen til en severdighet i lokalområdet. Fortell om stedets historie."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "naermiljo-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/naermiljo-0/"
}, {
  "id": "fred-1",
  "namn": "Fred",
  "type": "speider",
  "omrader": ["S", "V"],
  "mal": ["S-14", "V-12", "V-6"],
  "krav": ["Lag din egen definisjon av fred og tenk gjennom hva som er nødvendig for at et samfunn skal kunne leve fredelig. Snakk gjerne med andre mennesker for å finne ut hva de mener med fred. Ta kontakt med noen som har opplevd krig, konflikter osv.", "Delta aktivt i en fredsmarkering/fredsarrangement eller i en innsamlingsaksjon/bistandsprosjekt som har som mål å fremme fred.", "Sett deg inn i en pågående konflikt i samfunnet lokalt, nasjonalt eller internasjonalt. Lev deg inn i situasjonen og prøv å forstå begge partene. Kom med forslag til hvordan konflikten kan løses. Benytt gjerne rollespill, lek, teater, debatt o.l. eller diskuter det med en venn, familiemedlem eller leder.", "Finn ut hvordan speidere rundt i verden engasjerer seg i fredsarbeidet.", "Hold et foredrag på skolen, skriv et leserinnlegg eller en artikkel i en speideravis med temaer som fred, konfliktløsning eller flerkulturell forståelse.", "Finn en konflikt som pågår i Norge eller en situasjon du synes er uakseptabel i et fredelig samfunn, og skriv et engasjert brev til den du synes kan og bør gjøre noe med det.", "Finn ut hvordan krig påvirker barns liv og rettigheter.", "Finn et menneske i ditt lokalsamfunn, på landsbasis eller i utlandet som har gjort seg bemerket i fredsarbeidet og som inspirerer deg. Hvis mulig, ta kontakt med vedkommende og gjør et intervju, eller lag en presentasjon/sak om personen til bruk i speidergruppa, lokalavisen eller en speideravis."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "fred-1",
  "url": "https://speiding.no/speiderprogram/speiderbasen/fred-1/"
}, {
  "id": "leir-tropp",
  "namn": "Leir (tropp)",
  "type": "patrulje",
  "omrader": ["F", "L", "V"],
  "mal": ["F-10", "F-13", "L-12", "V-1"],
  "krav": ["Vis at patruljen kan sette opp og ta ned telt og ta ansvaret for vedlikeholdet av patruljeteltet.", "Gå over og sjekk utstyret i patruljekassen. Sørg for at alt nødvendig utstyr er på plass.", "(Velg 1 av 3) Gjør to av disse tingene før leiren: Sett opp en liste over nødvendig leirutstyr for en ukes leir. Sørg for at utstyret kommer med på en leir, og at det rengjøres og repareres etter leiren. Lag et patruljesærpreg til bruk på leiren", "Vær med på en leir som varer i minst tre dager, og vis hvordan man oppbevarer mat og håndterer søppel.", "(Velg 1 av 4) Gjør minst to av punktene på leir med gruppa: Ta ut en leirplass og forklar hvorfor dere valgte akkurat dette stedet. Lag en skisse over patruljens leirplass. Lag ildsted, fettfelle og matkjeller. Lag deres egen mat på leiren. Vær med i planleggingen og etterarbeidet av en leir. Skriv en rapport som en annen patrulje kan hente tips og råd fra senere."],
  "alderstrinn": "vandrer",
  "kategori": "tur",
  "uid": "leir-tropp",
  "url": "https://speiding.no/speiderprogram/speiderbasen/leir-tropp/"
}, {
  "id": "forstehjelp-1",
  "namn": "Førstehjelp",
  "type": "patrulje",
  "omrader": ["F", "V"],
  "mal": ["F-11", "F-12", "V-1"],
  "krav": ["Sette sammen patruljens førstehjelpsutstyr. Vær sikker på at alle i patruljen kjenner innholdet og kan bruke det.", "Lag båre og skikjelke og vis transport av en skadet person over hindringer med og uten båre. Vite hvordan dere tar vare på personen hvis dere må vente på hjelp.", "Vis hvordan dere skal opptre ved alvorlige bilulykker der flere av følgende skader forekommer: sjokk, benbrudd, blødninger fra dype sår og bevisstløshet. Forklar hvilke forholdsregler patruljen vil ta i en slik situasjon.", "Vis at dere sammen kan utføre hjerte- og lungeredning (HLR) uavbrutt i 25 minutter."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "forstehjelp-1",
  "url": "https://speiding.no/speiderprogram/speiderbasen/forstehjelp-1/"
}, {
  "id": "matauk-0",
  "namn": "Matauk",
  "type": "patrulje",
  "omrader": ["F", "K", "S"],
  "mal": ["F-4", "K-7", "S-10", "S-6"],
  "krav": ["Vis at du kjenner minst 10 ville urter/bær og deres bruksområde.", "Vis at dere kjenner de vanligste spiselige soppene og vet hvordan en kan finne ut om sopp er spiselige.", "Lag et treretters måltid der så mange som mulig av hovedingrediensene er skaffet i naturen.", "Prøv ut tørking eller røking av fisk.", "Bli kjent med forskjellige metoder for foredling/konservering av bær, sopp, frukt, grønnsaker og urter, og prøv ut minst en metode du ikke har prøvd før."],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "matauk-0",
  "url": "https://speiding.no/speiderprogram/speiderbasen/matauk-0/"
}, {
  "id": "primitiv-mat",
  "namn": "Primitiv mat",
  "type": "patrulje",
  "omrader": ["F", "K", "V"],
  "mal": ["F-4", "F-5", "K-7", "V-1"],
  "krav": ["Vis minst tre forskjellige måter å tilberede primitiv mat på (baking, koking, steking, røking, råkost).", "(Velg 2 av 4) Gjør minst to av disse punktene: Konstruer og bygg en røkeovn. Bruk den! Lag en primitiv ovn og stek egne brød. Lag en alternativ kjele og vis at den kan brukes til å koke egg. Skap en egen primitiv rett. Forbered den, lag den og forandre eventuelt oppskriften etter prøvesmaking", "Få en sum av speiderlederen, lag handleliste og gjør innkjøpet til en matrett.", "Prøv minst fem oppskrifter fra bøker om primitiv matlaging.", "Server et variert måltid med tre retter som består av primitivt tilberedt mat.", "Vis ulike båltyper som egner seg for koking og steking."],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "primitiv-mat",
  "url": "https://speiding.no/speiderprogram/speiderbasen/primitiv-mat/"
}, {
  "id": "spor",
  "namn": "Spor",
  "type": "patrulje",
  "omrader": ["F", "K", "S"],
  "mal": ["F-7", "K-2", "K-3", "S-6"],
  "krav": ["Lag avstøpninger av sporavtrykk av minst tre ville dyr, og av hund og katt (plastelina, gips m.m).", "Tegn ti forskjellige spor etter ville dyr, fortell litt om de forskjellige dyrenes atferd og om utbredelse på hjemstedet ditt (plakat, lysbildeserie e.l.).", "Lær dere å kjenne igjen sporene av svømmefugl, hønsefugl og fugl som lever i trær.", "På en patruljetur skal dere finne minst fem forskjellige dyremerkete ting fra naturen (avspiste kongler m.m.). Finn også minst fem forskjellige rester etter dyr (fjær, ekskrementer, skjelett m.m.)."],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "spor",
  "url": "https://speiding.no/speiderprogram/speiderbasen/spor/"
}, {
  "id": "hytte",
  "namn": "Hytte",
  "type": "patrulje",
  "omrader": ["F"],
  "mal": ["F-1", "F-10", "F-11", "F-3"],
  "krav": ["Lær dere hyttereglementet for speiderhytta eller den aktuelle hytta dere skal besøke.", "Organiser avsluttende arbeid etter en helgetur på en hytte (rydding, vask, vedhugging, vedbæring, osv.).", "Fortell hvilke forsiktighetsregler dere bør følge ved bruk av peis, parafinlamper, ovner, primus og propananlegg, gasslamper og levende lys. Fortell om andre vanlige brannårsaker.", "Forklar forskjellen på hovedsikringer og kurssikringer. Vis at dere kan skifte sikring og at dere kjenner faremomentene ved elektriske anlegg.", "Vis at du kan betjene et solcellepanel eller et aggregat (hvis hytta har dette).", "Vis at dere kan bruke et brannslukningsapparat, kjenner rømningsveiene og vet hva dere skal gjøre dersom det bryter ut brann.", "Planlegg og gjennomfør en overnattingstur til speiderhytta (en hytte) uten en voksen leder."],
  "alderstrinn": "vandrer",
  "kategori": "tur",
  "uid": "hytte",
  "url": "https://speiding.no/speiderprogram/speiderbasen/hytte/"
}, {
  "id": "kano",
  "namn": "Kano",
  "type": "patrulje",
