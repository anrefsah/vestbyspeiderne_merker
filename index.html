  "krav": ["Lær om hvordan vi kan unngå å spre smitte til andre, blant annet gjennom god hygiene.", "Lær deg å vaske hendene riktig med såpe og vann, og øv deg på å huske å gjøre det når du kommer hjem, når du har vært på do, før du skal spise eller lage mat og når du skal møte noen andre.", "Tegn en hyggelig tegning til noen som er ensom eller kjeder seg hjemme. Husk hygienereglene når du arbeider!", "Bruk kroppen aktivt minst én time hver dag og minst to timer hver dag i helgen, aller helst ute, i minst én uke.", "Prøv ut en aktivitet sammen med en venn hvor dere ikke er i nærheten av hverandre.", "Lær hva en epidemi og en pandemi er, og lær om hvordan vi holder oss selv friske og unngår å smitte andre, for eksempel gjennom god hygiene, karantene og stenging av offentlig steder og arrangementer.", "Lær deg å vaske hendene riktig med såpe og vann, og venn deg til å gjøre det når du kommer hjem, når du har vært på do, før du skal spise eller lage mat og når du skal møte noen andre.", "Lag pynt eller noe annet som kan gis til noen som er i karantene. Husk hygienereglene når du arbeider!", "Prøv ut to-tre nye fysiske aktiviteter, og gjennomfør dem i minst én time hver dag, inne eller ute, i minst én uke.", "Ha flere aktiviteter sammen med en venn eller noen i familien uten at dere er nære hverandre, for eksempel på telefon, videosamtale eller lignende.", "Lær om smittevern og karantene.", "Praktiser de vanlige anbefalingene for å unngå smittespredning, som håndvask, bruk av lommetørkle og vise hensyn ved hosting og nysing, holde god avstand med mer.", "Finn ut hvordan du kan gjøre dagen hyggeligere for familiemedlemmene som må holde seg hjemme over lang tid, og gjør det.", "Gå, sykle, padle eller liknende til et nytt sted hver dag eller studér forandringene i naturen, ta naturbilder eller liknende i minst én uke.Hvis du ikke kan gå ut, gjør noe aktivt og nyttig inne.", "Legg ut noe oppmuntrende på sosiale medier. Praktiser nettvett og medievett: vær en god venn på nettet, vær kildekritisk og tenk over hva du deler.", "Skriv dagbok om hva du har opplevd, gjort og tenkt i løpet av dagen. Ta med både positive og negative ting.", "Lær hvordan epidemier og pandemier utvikler seg, og hvordan utviklingen kan forebygges eller forsinkes. Lær om karantene reglene og pass på at du og de rundt deg respekterer dem.", "Praktiser de vanlige hygienerådene for å unngå smittespredning.", "Legg ut noe oppmuntrende på sosiale medier. Vis ro og vær en god venn og et godt forbilde, også på nettet. Tenk nettvett og medievett når du ser etter informasjon om pandemien på nett. Vurder hva du deler, og still kildekritiske spørsmål (hvem, hvorfor, hvordan, når og kilder).", "Hold deg i aktivitet og prøv å oppleve noe nytt hver dag. Vær ute minst en time hver dag, og lenger på fridager. Hvis du ikke kan gå ut, gjør noe aktivt inne."],

  "hvorfor": "Lære hvordan påhengsmotor fungerer og hvordan den skal behandles og vedlikeholdes.",
  "krav": ["Forklar virkningene av forskjellig tiltvinkel på en påhengsmotor. Vis at du kan justere den. Forklar forskjellen på lang og kort stamme. Vis hvordan en påhengsmotor monteres riktig og festes forsvarlig i båten.", "Vis at du kan starte og stanse en påhengsmotor og bruke choke riktig.", "Vis at du kjenner til tenningssystemet på en to-takts utenbordsmotor. Vit hvor du finner tennplugger og coil på motoren. Etterse og skift tennplugger.", "Vis at du kjenner til forskjellige drifstofftyper og at du kan fylle drivstoff. Vis at du kjenner sikkerhetsreglene i forbindelse med fylling, bruk og lagring av drivstoff.", "Forstå betydningen av riktig kjøling og kontroller at påhengsmotoren får kjøling under drift.", "Forstå betydningen av riktig smøring i motoren. Vis hvordan du sørger for smøring i bensinen og til gearet på en to-takts utenbordsmotor.", "Vis at du kan bruke gear og gass riktig. Lær å finne tomgangsjusteringen på en to-takts utenbordsmotor og pek ut de ytre delene i motoren som tilhører gear og gass.", "Lær hvordan propellen på en påhengsmotor er festet. Lær også å ta av propellen og skifte sikringssplint (brytepinne).", "Vis at du kan gjøre enkelt vedlikehold av en to-takts utenbordsmotor og holde forsvarlig tilsyn med den.", "Finn ut hvordan du kan skaffe reservedeler og få utført reparasjoner i nærheten av det stedet der du bor.", "Fortell om de vanligste årsakene til at en to-takts utenbordsmotor plutselig stanser. Vit hvordan du skal lete etter årsakene og rette på dem."],

  "krav": ["Gjør minst fire av disse oppgavene:", "(Velg 4 av 8) Puss sølvtøy eller vinduer.", "(Velg 4 av 8) Støvsug og vis at du kan tømme støvsugeren.", "(Velg 4 av 8) Lag frokost, rydd etter frokosten og vask opp på en patruljetur.", "(Velg 4 av 8) Vask en ullgenser eller stryk en bluse eller skjorte.", "(Velg 4 av 8) Vær med å vaske speiderhytta.", "(Velg 4 av 8) Hold god orden på rommet ditt minst en måned.", "(Velg 4 av 8) Vær med på storrengjøring hjemme", "(Velg 4 av 8) Vise at du kan bruke strykejern", "Vis at du kan sortere klesvask riktig (farger, ulike stoff o.l.).", "Ta ansvar for riktig sortering av søppel hjemme.", "Rydde ut av sekken etter en tur.", "Vis at du holder speiderskjorta ren og ordentlig."],

  "hvorfor": "Delta i aktiviteter som øker fysisk aktivitet",
  "krav": ["Tilfredsstill kravene til minst to av disse idrettsgrenene:", "(Velg 2 av 5) Svømming: - svøm minst 100 meter bryst og 50 meter rygg. - vis at du kan dykke til 2 meters dyp - vis at du kan hoppe eller stupe fra 2 meters høyde.", "(Velg 2 av 5) Roing: - vis at du kan svømme 25 meter - vis at du kan ro alene og sammen med en annen - vis at du kan skåte og snu. - vis at du kan legge til en brygge og fortøye båten med ordentlige knuter.", "(Velg 2 av 5) Skøyter: - vis at du kan gå 1 km på skøyter. - vis at du kan gå minst 15 meter baklengs på skøyter", "(Velg 2 av 5) Ski: - gå til sammen 50 km på ski i løpet av vinteren - vis at du kan hoppe 5 meter på ski - vis parallellsving (slalåmsving) og telemarksving", "(Velg 2 av 5) Sykkel: - vis at du kan sykle 8 km på 30 min, eller vær med i et sykkelritt. - sykle minst 40 mil i løpet av sykkelsesongen", "Velg to av disse punktene:", "(Velg 2 av 6) Vær med i et volleyballspill eller basketballspill og vis at du kjenner reglene for spillet.", "(Velg 2 av 6) Spill minst tre fotballkamper og lær reglene.", "(Velg 2 av 6) Spill minst to håndballkamper og lær reglene.", "(Velg 2 av 6) Fortell hva overtrening kan føre til.", "(Velg 2 av 6) Vær med i et O-løp eller terrengløp på minst 3 km.", "(Velg 2 av 6) Ta et idrettsmerke eller svømmemerke"],

  "hvorfor": "Lære om skadevirkninger av rusmidler",

  "hvorfor": "Lære å lage noe nyttig av tekstiler",
  "krav": ["Lag minst to eksempler på plantefarging og forklar hvordan dere går fram. Lag en nyttegjenstand til patruljen, gruppen eller speiderhytta.", "Vit hva batikk er og fortell hva som trengs av utstyr for å lage noe i batikk. Prøv dere på minst en batikkmåte. Lag noe dere kan ha glede og nytte av senere (t-skjorte, duk, bestikkpose eller lignende).", "Vis eksempler på noe som er laget i stofftrykk. Lag minst to ting til patruljen, troppen, patrulje- eller troppsrommet eller speiderhytta.", "Lag patruljesærpreg, fotposer eller leirbålskappe e.l."],

  "id": "brannvern",
  "namn": "Brannvern",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/brannvern/",
  "omrader": ["F", "K"],
  "mal": ["F-11", "F-12", "K-2", "K-4"],
  "hvorfor": "Lære om forsvarlig bruk av ild, samt forebygging og håndtering av brann",
  "krav": ["Antenning: Forklar hva som må til for at det skal bli ild. Fortell om hva som kan stoppe eller begrense ilden, og om hva som gjør at det brenner fortere.", "Virkning: Forklar hvordan ild og røyk kan ødelegge materiell og drepe mennesker.", "Slukking: Forklar hvordan man slokker ild i treverk, skogbunn, trær, telt og brennbare væsker. Vis slokking med bøtte, slange, ullteppe, jakke og brannslukkingsapparat.", "Varsling: Demonstrer korrekt varsling av brannvesenet (simulert). Vit når man ringer nødnummeret 110. Vit hvordan automatisk brannvarsling virker.", "Redning: Vis riktig gang i stige, og vit hvordan en redningsstige løses ut. Vis nedfiring i tau og opptreden i røykfullt rom. Vis løfting, bæring og sleping av innesperrede og bevisstløse personer.", "Evakuering: Gjennomfør en evakueringsøvelse på speiderlokalet. Avtal møteplass på forhånd og gjennomfør en opptelling når dere har kommet ut. Diskuter hvordan man skal forholde seg hvis noen mangler.", "Forebygging: Vit hva et branntilsyn er og hva det omfatter. Nevn minst fem vanlige brannårsaker og fortell hvordan de kan forebygges. Kjenn til reglene for oppbevaring av gass og brennbare væsker og forklar hva som kan skje hvis disse ikke overholdes. Forklar hva selvantenning og kortslutning er, og fortell hva uforsiktig bruk av ildsfarlige væsker kan føre til.", "Branntilsyn: Finn potensielle brannårsaker i speiderlokalet og diskuter om disse kan forebygges. Test røykvarsler og demonstrer skifte av batteri. Vis kontroll og vedlikehold av brannslukkingsapparat."],
  "alderstrinn": "stifinner",
  "kategori": "mote",
  "uid": "brannvern"
}, {

  "hvorfor": "Bli kjent med ulike kommunikasjonskanaler og finn ut av hva som er forsvarlig bruk av disse",
  "krav": ["Gjennomfør minst to av disse:", "(Velg 2 av 5) Bruk samband aktivt på en tur. Kjenn vilkårene for å eie privat radioutstyr (walkie talkie).", "(Velg 2 av 5) Kjenn de nødsignaler som brukes mest i radiotelegrafi og telefoni, og vit hvordan disse brukes.", "(Velg 2 av 5) Vis at du behersker bruk av e-post.", "(Velg 2 av 5) Lek med semafor på en tur, og forsøk å sende meldinger til hverandre.", "(Velg 2 av 5) Kjenn de mest brukte \"bakke til luft\" signalene, og vit hvordan disse lages i terrenget.", "Lær dere nettvettreglene og diskuter disse i patruljen.", "Lag en veggavis, lysbildeserie eller lignende som beskriver en del viktige former for kommunikasjon i ulike deler av verden (f.eks. aviser, blader, radio, TV, telefax, Internett, telefon, mobiltelefon). Diskuter ulikhetene.", "Arranger et besøk hos en avisredaksjon eller en radiostasjon eller inviter dem til å besøke dere på et patrulje- eller troppsmøte for å informere om sin virksomhet.", "Diskuter og skriv ned patruljens etiske regler for bruk av SMS, MMS og e-post."],

  "krav": ["Fortell om elektrisitet og de vanlige måleenhetene (volt, ampere, ohm og watt). Forklar hvorfor spenningsførende ledninger må isoleres.", "Finn ut hva elektrisk strøm koster der du bor.", "Finn hovedbryteren i huset der du bor og lær å slå den av.", "Tegn og forklar en strømkrets med sikringselement, stikkontakt, bryter og lampeholder.", "Gjør to av disse punktene:", "Forklar hvordan en akkumulator er bygget opp og hvordan den virker", "Forklar hva kortslutning og overledning er. Forklar hvordan en sikring virker og hva slags stell den skal ha.", "Skift sikringer og lyspærer og vit hvor sterke de skal være.", "Vis forsiktighetsreglene ved bruk av elektriske apparater.", "Lær å lodde.", "Lag en elektromagnet og kople den til en strømkilde."],

  "hvorfor": "Lære å planlegge og gjennomføre et leirbål",
  "krav": ["Lag et leirbålsprogram og gjennomfør det på en tropps- eller gruppetur.", "Lær dere minst to nye speidersanger og to nye leirbålssanger. Lag minst ett leirbålsrop. Lær det videre til andre speidere.", "Øv inn minst tre leirbålsleker eller leirbålskonkurranser. Lær dem videre på et leirbål.", "Sett i stand en leirbålsplass og ta ansvaret for gjennomføringen av det tekniske arrangementet av et lite leirbål, også opprydning etterpå.", "Diskuter god leirbålsskikk (eks. brenning av søppel, respekt for bålet o.l.)."],

  "hvorfor": "Lær om speidingens særtrekk og historie",
  "krav": ["Tegn begge verdensmerkene, og forklar patruljen hva symbolene i merkene står for.", "Hvilke felles markeringsdager har speidere over hele verden? Ta for deg en av dagene og finn ut hvordan denne markeres i tre forskjellige land (minst ett land utenfor Norden).", "Bli kjent med en speider fra et land utenfor Norden. Finn likheter og ulikheter mellom speiderarbeidet i dette landet og Norge.", "Gjør rede for hva som skiller speiderarbeidet i Norge fra speiderarbeidet i andre land (hva er typisk norsk?).", "Lag en enkel presentasjon som forteller noe om speidingens historie.", "Løs to av disse oppgavene:", "- Fortell de andre i patruljen hvorfor Lord Baden-Powell startet speiderbevegelsen?", "- Dramatiser sangen «Lord Baden-Powell i England satt»", "- Lær noen Lord Baden-Powell-sitater.", "- Les en bok av eller om Baden-Powell og speiding.", "- Finn fram til hjemmesidene til og lag en veggplansje eller lignende som forteller om WOSM og WAGGG, og undersøk hvordan disse organisasjonene er bygd opp, og hva de arbeider med."],

  "mal": ["S-3", "S-4", "S-6", "S-7", "S-8"],
  "hvorfor": "Lær om natur- og miljøvern",
  "krav": ["Transport (to av tre oppgaver må gjennomføres):", "- Lag et oppslag til å henge på veggen, der du/dere gjør rede for hvordan transport påvirker miljøet, både i lokal, nasjonal og global målestokk;", "- Gå/sykle til alle speidermøter og turer i 3 måneder. Hvis avstanden er over 3 km, kan kollektiv transport benyttes;", "- Reis på minst en tur der dere benytter sykkel som fremkomstmiddel.", "Ressurser (to av tre oppgaver må gjennomføres):", "- Lag et oppslag til å henge på veggen, der du/dere gjør rede for begrepene «fornybare - ressurser» og «ikke-fornybare ressurser» med eksempler. Finn ut hvor lenge de ikke-fornybare ressursene vil vare med den bruk vi har i dag. Gi eksempler på hvordan ressurser kan gjenvinnes. Kan troppen gjøre noe med dette?", "- Få en omvisning på et (inter)kommunalt gjenvinningsanlegg, og finn ut hva som skjer med innlevert avfall;", "- Gjør dere kjent med kommunens kildesorteringsordninger. Undersøk om din egen familie benytter seg av alle ordningene som tilbys. Hvis ikke: hjelp til hjemme, slik at dere benytter dere av alle ordningene som tilbys.", "Prosjekter (en av de to oppgavene må gjennomføres):", "- Delta på et natur- eller miljøvernprosjekt i regi av en annen organisasjon på hjemstedet ditt/deres. Inviter organisasjonen på et troppsmøte før arrangementet, for å få bakgrunnsinfo om prosjektet;", "- Sett i gang troppens eget natur- eller miljøvernprosjekt.", "- Økologi: Illustrer en enkel næringskjede. Hva kan skje dersom et av leddene i kjeden blir skadet eller forsvinner? Lag en oversikt over dyr eller planter i ditt distrikt som står i fare for å bli utryddet. Forklar hvorfor. Er det noe troppen kan gjøre med dette?"],

}, {

  "omrader": ["S", "V"],
  "mal": ["S-1", "S-11", "S-5", "V-12"],
  "hvorfor": "For å lære om barn og unges rettigheter.",
  "krav": ["Finn ut hva FN står for og hvordan den er organisert.", "Finn informasjon om barnekonvensjonen og les om barn og unges rettigheter. Lag en liste over de rettighetene som er viktigst for deg. Bruk et patruljemøte eller deler av et troppsmøte til å diskutere dette i patruljen. Er barns rettigheter godt ivaretatt i Norge?", "Gjør dere kjent med FNs bærekraftsmål. Ta for dere troppens terminliste og se på hvordan dere kan jobbe med bærekraftsmålene.", "Skriv et brev til Statsministeren i Norge om hvordan det er å være barn i Norge og hvordan du mener Norge kan bli et enda bedre sted for barn."],

}, {
  "id": "naermiljo-0",
  "namn": "Nærmiljø",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/naermiljo-0/",
  "omrader": ["S"],
  "mal": ["S-11", "S-14", "S-3"],
  "hvorfor": "Bli kjent med nærmiljøet",
  "krav": ["Finn beliggenheten til nærmeste brannstasjon, politistasjon, lege, sykehus, legevakt, apotek, postkontor, hotell, kirke, skole og bibliotek. Finn også ut hvor noen lokale severdigheter ligger. Demonstrer dette ved at du på en enkel måte forklarer en fremmed veien.", "Lag et kart over viktige veier, gater og stier, samt vann, elver, hus og lignende, innenfor en radius av en kilometer fra speiderhuset, patruljestedet eller et annet sted.", "Lag en hjemstedsbok med følgende opplysninger: geologi, dyre- og planteliv, historie, folkeminner og stedsnavn, historiske minnesmerke, næringslivet, kirkens historie og ulike turmål med en kort presentasjon. Boka skal være rikt illustrert med skisser, tegninger, figurer og bilder. Presenter boka for kommunens ordfører eller en annen sentral person på stedet.", "Velg en aktuell sak i kommunen eller nærmiljøet, og følg denne saken til avgjørelse er tatt. Lag en utstilling med avisutklipp, intervjuer, bilder og annet.", "Delta på Rusken-aksjon/strandryddedag eller et annet prosjekt hvor du kan hjelpe til med å rydde/ordne for nærmiljøet.", "Arranger en tur for patruljen eller troppen til en severdighet i lokalområdet. Fortell om stedets historie."],
  "alderstrinn": "stifinner",
  "kategori": "mote",
  "uid": "naermiljo-0"
}, {
  "id": "fred-1",
  "namn": "Fred",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/fred-1/",
  "omrader": ["S", "V"],
  "mal": ["S-14", "V-12", "V-6"],
  "hvorfor": "For å forstå hva fred betyr for deg og andre, og hvordan man kan jobbe for fred.",
  "krav": ["Lag din egen definisjon av fred og tenk gjennom hva som er nødvendig for at et samfunn skal kunne leve fredelig. Snakk gjerne med andre mennesker for å finne ut hva de mener med fred. Ta kontakt med noen som har opplevd krig, konflikter osv.", "Delta aktivt i en fredsmarkering/fredsarrangement eller i en innsamlingsaksjon/bistandsprosjekt som har som mål å fremme fred.", "Sett deg inn i en pågående konflikt i samfunnet lokalt, nasjonalt eller internasjonalt. Lev deg inn i situasjonen og prøv å forstå begge partene. Kom med forslag til hvordan konflikten kan løses. Benytt gjerne rollespill, lek, teater, debatt o.l. eller diskuter det med en venn, familiemedlem eller leder.", "Finn ut hvordan speidere rundt i verden engasjerer seg i fredsarbeidet.", "Hold et foredrag på skolen, skriv et leserinnlegg eller en artikkel i en speideravis med temaer som fred, konfliktløsning eller flerkulturell forståelse.", "Finn en konflikt som pågår i Norge eller en situasjon du synes er uakseptabel i et fredelig samfunn, og skriv et engasjert brev til den du synes kan og bør gjøre noe med det.", "Finn ut hvordan krig påvirker barns liv og rettigheter.", "Finn et menneske i ditt lokalsamfunn, på landsbasis eller i utlandet som har gjort seg bemerket i fredsarbeidet og som inspirerer deg. Hvis mulig, ta kontakt med vedkommende og gjør et intervju, eller lag en presentasjon/sak om personen til bruk i speidergruppa, lokalavisen eller en speideravis."],
  "alderstrinn": "stifinner",
  "kategori": "mote",
  "uid": "fred-1"
}, {

  "krav": ["Vis at du kjenner minst 10 ville urter/bær og deres bruksområde.", "Vis at dere kjenner de vanligste spiselige soppene og vet hvordan en kan finne ut om sopp er spiselige.", "Lag et treretters måltid der så mange som mulig av hovedingrediensene er skaffet i naturen.", "Prøv ut tørking eller røking av fisk.", "Bli kjent med forskjellige metoder for foredling/konservering av bær, sopp, frukt, grønnsaker og urter, og prøv ut minst en metode du ikke har prøvd før."],

  "krav": ["Lag avstøpninger av sporavtrykk av minst tre ville dyr, og av hund og katt (plastelina, gips m.m).", "Tegn ti forskjellige spor etter ville dyr, fortell litt om de forskjellige dyrenes atferd og om utbredelse på hjemstedet ditt (plakat, lysbildeserie e.l.).", "Lær dere å kjenne igjen sporene av svømmefugl, hønsefugl og fugl som lever i trær.", "På en patruljetur skal dere finne minst fem forskjellige dyremerkete ting fra naturen (avspiste kongler m.m.). Finn også minst fem forskjellige rester etter dyr (fjær, ekskrementer, skjelett m.m.)."],

  "hvorfor": "Utvikle kunnskap om kanotur",
  "krav": ["Vis at du kan svømme minimum 100 m med klær og redningsvest.", "Vis at du vet hvilke sikkerhetsregler du bør forholde deg til ved padling og bruk av kano.", "Vis at du kan utføre kameratredning av forlist kano på åpent vann (tømming og snuing av kano, ombordstigning av padlere).", "Vis at du kan utføre livredning fra vann. (Frigjøringsgrep, ilandføring av påkledd person over lengre strekning og munn mot munn metoden).", "Demonstrer hvordan en kano settes på vannet, hvordan man går om bord og hvordan kanoen tas på land.", "Vis den riktige måten å oppbevare kano, åre og redningsvester på land, og vis enkelt vedlikehold av kano og utstyr.", "Vis at du kan framdriftstak, støttetak og to styretak som virker hver sin vei.", "Vis at du og padlepartneren din kan padle en strekning på 200 meter rett fram uten å bytte padleside.", "Gjennomfør i tillegg to kanoturer på til sammen 20 km."],

  "mal": ["F-10", "F-11", "F-12", "F-3", "F-4"],
  "hvorfor": "Utvikle gode ferdigheter innen vinterfriluftsliv",
  "krav": ["Øv på å gå etter kart og kompass om vinteren og utenfor merket sti og løype", "Planlegg og gjennomfør en tre dagers patruljeleir om vinteren. Planlegg program og forpleining og følg punktene i \"Sjekklister for speidere på tur\" i heftet \"Sikkerhet på tur\".", "Sørg for at utstyret er i god stand før leiren. Patruljens medlemmer skal selv kunne utføre nødreparasjon av eget utstyr.", "Velg selv en leirplass på vinterføre og slå opp telt der. Ta hensyn til hvor brukbart stedet er som leirplass, sørg for at det er skjermet for være og vind osv.", "Lær å bygge iglo eller snøhule, og overnatt i den.", "Vis at dere kan tilberede mat ute om vinteren. Lag noen retter som er praktiske på vinterleir. Husk å ta hensyn til både vekt og næringsinnhold.", "Noter ned erfaringer fra leiren som dere og andre kan dra nytte av senere", "Fortell om de forskjellige grader og typer av forfrysninger og forklar hvordan de behandles."],

  "krav": ["Alle i patruljen skal ha minst en konkret oppgave i forbindelse med planlegging og gjennomføring av haiken.", "Patruljen lager logg fra haiken og leverer den til troppslederen.", "Alle i patruljen skal være med på en oppsummering av hvordan turen gikk og hva som er nyttig å huske på til neste gang.", "Patruljehaiken skal gjennomføres av patruljen alene - uten voksen leder."],

  "hvorfor": "Utvikle ferdigheter innen friluftsliv",

  "krav": ["Vis at du kan rengjøre, preparere og smøre ski.", "Gå minst like mange mil, som du er år gammel, på ski i løpet av vinteren.", "Gjør minst fire av disse tingene:", "Hopp minst 12 meter på ski.", "Vær med i et skirenn på minst 10 km.", "Lær telemarksving og parallellsving.", "Arranger smørekurs for patruljen, troppen eller flokken.", "Planlegg og led en patruljetur på ski.", "Delta på skiorientering, minimum 3 km og 6 poster.", "Bygg et skileikanlegg og arranger en skileik for patruljen, troppen eller flokken.", "Lær deg å ta en 360 på ski.", "Lær deg å ta 180 med baklengs landing på ski.", "Lær deg å kjøre halfpipe på snowboard."],

  "hvorfor": "Tilegne seg kunnskap om fisking",

  "hvorfor": "Tilegne seg kunnskap om dyr og dyrehold",

  "krav": ["Pek ut steder i terrenget og bruk kartet for å finne avstanden til dem.", "Lær å orientere et kart ved hjelp av kompasset. Lær også andre måter å orientere kartet på.", "Følg en oppgitt rute ved hjelp av kartet. Ruta skal være minst to kilometer, og skal gå i terrenget.", "Kjenn til hva misvisning er, og hvordan du kan finne misvisningen på kartet.", "Vis at du kan kompassets 16 hovedretninger.", "Foreta en krysspeiling.", "Gjennomfør et O-løp på minst fire kilometer, og med minst 6 poster sammen med en annen.", "Legg opp enkelt O-løp til bruk i patruljen eller troppen.", "Vis at du kan gå minst 500m etter en kompasskurs."],

  "id": "jotajoti",
  "namn": "JOTA/JOTI",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/jotajoti/",
  "omrader": ["K", "V"],
  "mal": ["K-5", "V-11", "V-4"],
  "hvorfor": "For å lære å kommunisere med andre speidere gjennom radio.",
  "krav": ["Vær aktivt med på en JOTA/JOTI.", "Gjennomfør minst 6 QSO-er (samtaler) og skriv logg og QSL-kort for dem. En av QSO-ene skal være en stasjon utenfor Norge.", "Lær det fonetiske alfabet og bokstaver ditt eget navn.", "Lær minst 6 av de mest brukte Q-kodene.", "Kjenn til speiderfrekvensene i amatørradiobåndene, og kjenn til vanlig rekkevidde for disse frekvensene.", "Vær med på minst to JOTA/JOTI-aktiviteter utenom radio og nettprat. Det kan være internasjonal mat, radiopeileorientering eller noe annet.", "Oppnå kontakt med speidere i andre land på Internett."],

  "kategori": "mote",
  "uid": "jotajoti"
}, {
  "id": "tolk",
  "namn": "Tolk",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/tolk/",
  "omrader": ["K", "V"],
  "mal": ["K-2", "V-11", "V-4"],
  "hvorfor": "Bli kjent med speidere i andre land og tren på å kommunisere på andre språk enn norsk.",
  "krav": ["Hold regelmessig kontakt med en utenlandsk ungdom (ikke skandinavisk) i minst ett år, eller delta på en leir med utenlandske speidere i et annet land (ikke skandinavisk).", "Delta på JOTA eller JOTI, og gjennomfør en samtale/chat med en speider fra et land utenfor Skandinavia, der du forteller om hjemstedet ditt, speidergruppa di og deg selv.", "Øv deg på å føre en alminnelig samtale om hjemstedet ditt, dagligliv, severdigheter og hvordan man skal finne frem, på et ikke-skandinavisk språk. Gjennomfør en samtale med en utenlandsk speider eller en annen som besøker Norge.", "Les og oversett et stykke om forholdene i et annet ikke-skandinavisk land."],
  "alderstrinn": "stifinner",
  "kategori": "hjemme",
  "uid": "tolk"
}, {
  "id": "journalist-0",
  "namn": "Journalist",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/journalist-0/",
  "omrader": ["S", "V"],
  "mal": ["S-2", "V-4"],
  "hvorfor": "Lær om media og tren på å skrive artikler",
  "krav": ["Sett deg inn i «Vær varsom reglene» for journalister. Les en artikkel som står skrevet i en lokalavis, riksavis, i et ungdomsmagasin eller et ukeblad. Oppfyller de kravene til «Vær varsom reglene»?", "Skriv en reportasje/leserinnlegg fra et speiderarrangement eller noe annet som opptar deg.", "Send en artikkel til lokalavisen eller få den trykt i «Speideren».", "Besøk lokalavisa, nærradiostasjonen, lokal TV-stasjonen eller NRK sitt distriktskontor. Finn ut mest mulig om hva som skjer fra starten på en reportasje til den er ferdig trykket eller har gått «på lufta». Husk å avtale besøket med avisa eller radio-/TV stasjonen på forhånd."],
  "alderstrinn": "stifinner",
  "kategori": "mote",
  "uid": "journalist-0"
}, {
  "id": "verden-og-vi-0",
  "namn": "Verden og vi",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/verden-og-vi-0/",
  "omrader": ["S", "V"],
  "mal": ["S-12", "S-13", "S-9", "V-7"],
  "hvorfor": "For å forstå hva som bidrar til mer rettferdig fordeling av ressurser mellom verdens land, og reflekter over hvordan vi har det i Norge, sammenlignende med andre land.",
  "krav": ["Sett dere inn i hva som menes med rettferdig handel (Fairtrade), og finn noen eksempler på rettferdige produkter. Hvordan kan vi som forbrukere bidra til at rettferdige produkter blir mer utbredt? Finn ut hvor og under hvilke forhold klærne du eier er produsert, og hvor mye lønn arbeiderne får.", "Undersøk om speidergruppa har en bevisst praksis rundt miljø og rettferdig handel, og ta initiativ til forbedringstiltak.", "Finn ut mer om maktforholdet mellom rike og fattige land, og hvordan det kommer til uttrykk gjennom handel mellom land, internasjonale avtaler, bistands- og utviklingsarbeid og u-landsgjeld.", "Sammenlign speiderarbeidet i Norge og 1-2 ikke-vestlige land.", "Inviter en person fra et annet land for å fortelle om landet sitt, for eksempel historie, kultur, økonomien, familieforholdene og naturen. Hvordan opplever dere kulturelle forskjeller og likheter mellom Norge og landet?"],
  "alderstrinn": "stifinner",
  "kategori": "lavthengende",
  "uid": "verden-og-vi-0"
}, {
  "id": "flerkulturell-0",
  "namn": "Flerkulturell",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/flerkulturell-0/",
  "omrader": ["S", "V"],
  "mal": ["S-11", "S-13", "V-12"],
  "hvorfor": "Bli kjent med minoritetsbefolkningen der du bor",
  "krav": ["Finn ut hvilke 5 nasjonaliteter det kommer flest mennesker fra på ditt hjemsted.", "Prøv å finne ut om det finnes noen flyktning- eller innvandrerorganisasjon på ditt hjemsted, og hva slags aktiviteter de driver med og for hvem.", "Inviter medlemmer fra en slik organisasjon med på et speidermøte eller en speidertur."],
  "alderstrinn": "stifinner",
  "kategori": "mote",

}, {
  "id": "god-torn-0",
  "namn": "God tørn",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/god-torn-0/",
  "omrader": ["L", "S"],
  "mal": ["L-5", "S-11", "S-3", "S-4"],
  "hvorfor": "Gjør en god gjerning for andre",
  "krav": ["Gjør en tjeneste for en annen person (minst 2 måneder for stifinnere og 3 måneder for vandrere). F.eks:", "- være pasientvenn/besøksvenn gjennom Røde Kors", "- være flyktningguide", "- holde en natursti ren", "- være med på vedaksjon", "- rydde, male, bære ved, vaske og lignende hos noen som trenger det.", "Vær aktiv med i en aksjon for å hjelpe medmennesker i ditt nærmiljø.", "Vær aktiv med i en aksjon for å hjelpe medmennesker i et annet land.", "Ta ansvar for opprydning og vask etter en tur/leir og et troppsmøte."],
  "alderstrinn": "stifinner",
  "kategori": "hjemme",
  "uid": "god-torn-0"
}, {
  "id": "leir-tropp",
  "namn": "Leir (tropp)",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/leir-tropp/",
  "omrader": ["F", "L", "V"],
  "mal": ["F-10", "F-13", "L-12", "V-1"],
  "hvorfor": "Få trening i å planlegge og være på leir med ansvar for utstyr",
  "krav": ["Vis at patruljen kan sette opp og ta ned telt og ta ansvaret for vedlikeholdet av patruljeteltet.", "Gå over og sjekk utstyret i patruljekassen. Sørg for at alt nødvendig utstyr er på plass.", "Gjør to av disse tingene før leiren:", "Sett opp en liste over nødvendig leirutstyr for en ukes leir.", "Sørg for at utstyret kommer med på en leir, og at det rengjøres og repareres etter leiren.", "Lag et patruljesærpreg til bruk på leiren", "Vær med på en leir som varer i minst tre dager, og vis hvordan man oppbevarer mat og håndterer søppel.", "Gjør minst to av punktene på leir med gruppa:", "Ta ut en leirplass og forklar hvorfor dere valgte akkurat dette stedet. Lag en skisse over patruljens leirplass.", "Lag ildsted, fettfelle og matkjeller.", "Lag deres egen mat på leiren.", "Vær med i planleggingen og etterarbeidet av en leir. Skriv en rapport som en annen patrulje kan hente tips og råd fra senere."],
  "alderstrinn": "stifinner",
  "kategori": "tur",
  "uid": "leir-tropp"
}, {
  "id": "forstehjelp-1",
  "namn": "Førstehjelp",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/forstehjelp-1/",
  "omrader": ["F", "V"],
  "mal": ["F-11", "F-12", "V-1"],
  "hvorfor": "Utvikle gode ferdigheter innen førstehjelp",
  "krav": ["Sette sammen patruljens førstehjelpsutstyr. Vær sikker på at alle i patruljen kjenner innholdet og kan bruke det.", "Lag båre og skikjelke og vis transport av en skadet person over hindringer med og uten båre. Vite hvordan dere tar vare på personen hvis dere må vente på hjelp.", "Vis hvordan dere skal opptre ved alvorlige bilulykker der flere av følgende skader forekommer: sjokk, benbrudd, blødninger fra dype sår og bevisstløshet. Forklar hvilke forholdsregler patruljen vil ta i en slik situasjon.", "Vis at dere sammen kan utføre hjerte- og lungeredning (HLR) uavbrutt i 25 minutter."],
  "alderstrinn": "stifinner",
  "kategori": "mote",
  "uid": "forstehjelp-1"
}, {
  "id": "primitiv-mat",
  "namn": "Primitiv mat",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/primitiv-mat/",
  "omrader": ["F", "K", "V"],
  "mal": ["F-4", "F-5", "K-7", "V-1"],
  "hvorfor": "Lære å lage mat ute på tur",
  "krav": ["Vis minst tre forskjellige måter å tilberede primitiv mat på (baking, koking, steking, røking, råkost).", "Gjør minst to av disse punktene:", "Konstruer og bygg en røkeovn. Bruk den!", "Lag en primitiv ovn og stek egne brød.", "Lag en alternativ kjele og vis at den kan brukes til å koke egg.", "Skap en egen primitiv rett. Forbered den, lag den og forandre eventuelt oppskriften etter prøvesmaking"],
  "alderstrinn": "stifinner",
  "kategori": "lavthengende",
  "uid": "primitiv-mat"
}, {
  "id": "hytte",
  "namn": "Hytte",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/hytte/",
  "omrader": ["F"],
  "mal": ["F-1", "F-10", "F-11", "F-3"],
  "hvorfor": "Lære å ta vare på og bruke hytta på forsvarlig måte",
  "krav": ["Lær dere hyttereglementet for speiderhytta eller den aktuelle hytta dere skal besøke.", "Organiser avsluttende arbeid etter en helgetur på en hytte (rydding, vask, vedhugging, vedbæring, osv.).", "Fortell hvilke forsiktighetsregler dere bør følge ved bruk av peis, parafinlamper, ovner, primus og propananlegg, gasslamper og levende lys. Fortell om andre vanlige brannårsaker.", "Forklar forskjellen på hovedsikringer og kurssikringer. Vis at dere kan skifte sikring og at dere kjenner faremomentene ved elektriske anlegg.", "Vis at du kan betjene et solcellepanel eller et aggregat (hvis hytta har dette).", "Vis at dere kan bruke et brannslukningsapparat, kjenner rømningsveiene og vet hva dere skal gjøre dersom det bryter ut brann.", "Planlegg og gjennomfør en overnattingstur til speiderhytta (en hytte) uten en voksen leder."],
  "alderstrinn": "stifinner",
  "kategori": "tur",
  "uid": "hytte"
}, {
  "id": "vinterspeiding",
  "namn": "Vinterspeiding",
  "type": "patrulje",
  "url": "https://speiding.no/speiderprogram/speiderbasen/vinterspeiding/",
  "omrader": ["F"],
  "mal": ["F-10", "F-11", "F-12", "F-3"],
  "hvorfor": "Utvikle gode friluftslivsferdigheter for vinterspeiding",
  "krav": ["Vis at du kan fjellvettreglene.", "Vis at du vet hvor det kan gå snøskred.", "Vis at du kan gjøre et sikkert veivalg med tanke på å unngå å bli tatt av snøskred.", "Sett opp en liste over personlig utstyr for en dagstur og en overnattingstur ute om vinteren.", "Grav eller bygg en overnattingsplass for minst to personer i snø.", "Gjennomfør to turer med overnatting ute om vinteren. På minst en av turene skal dere overnatte i snø.", "Vis at du vet hva slags proviant som egner seg på turer ute om vinteren.", "Vis at du kan krysspeiling.", "Øv på å gå etter kompasskurs i dårlig sikt", "Vis at du kan behandle en forfrysning, og kjenn til tegn og behandling av generell nedkjøling."],
  "alderstrinn": "stifinner",
  "kategori": "tur",
  "uid": "vinterspeiding"
}, {
  "id": "gps",

  "omrader": ["F", "K"],
  "mal": ["F-2", "K-5", "K-6"],
  "hvorfor": "Lære å bruke GPS",
  "krav": ["Forstå UTM kart systemet.", "Forstå oppbygningen av en GPS.", "Vite begrensningene til en GPS.", "Ta ut punkter fra kart i UTM.", "Finne tilbake til et punkt på kart fra en koordinat.", "Gjennomføre en GPS-løype med minst 6 punkter, som skal gå fra punkt til punkt ved bruk at UTM-koordinater."],

  "id": "fuglekjennskap",
  "namn": "Fuglekjennskap",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/fuglekjennskap/",
  "omrader": ["F", "K", "S"],
  "mal": ["F-8", "K-3", "S-6", "S-7"],
  "hvorfor": "Tilegne seg kunnskap om naturen og kunne kjenne igjen ulike fugler",
  "krav": ["Gå ut en tur og pek ut minst fem forskjellige småfugler som du kjenner navnet på.", "Vis at du kjenner igjen tre forskjellige rovfugler.", "Vis at du kjenner igjen tre forskjellige fugler ved å høre sangen deres.", "Velg to av disse:", "- Lag og sett opp en fuglekasse. Vedlikehold den hele året. Studer fuglelivet der en periode.", "- Lag en foringsautomat, heng den opp og hold småfuglene med mat en hel vinter.", "- Kunne angi 10 forskjellige ville fugler etter låten.", "- Gi ditt bidrag til vern om fuglelivet på ditt hjemsted (avisinnlegg, støtt naturvernforening m.m.)."],
  "alderstrinn": "stifinner",
  "kategori": "hjemme",
  "uid": "fuglekjennskap"
}, {
  "id": "skogbruk",
  "namn": "Skogbruk",
  "type": "speider",
  "url": "https://speiding.no/speiderprogram/speiderbasen/skogbruk/",
  "omrader": ["S"],
  "mal": ["S-10", "S-6", "S-7"],
  "hvorfor": "Tilegne seg kunnskap om norsk skog og få bedre forståelse av den skogen vi bruker, samt kunne sørge for ved på speiderhytta.",
  "krav": ["Lag en woodcrafttavle med minst åtte tresorter.", "Lær om de viktigste tresortene som finnes i Norge, og finn ut hvor de vokser.", "Lær om folketro og tradisjonell bruk knyttet til to norske tresorter.", "Vær med på vedhogst, f.eks. til speiderhytta. Vis hvordan du lager et reis.", "Kontakt noen som eier skog og lær deg noe om skogplanting. Vær med på skogplanting hvis det er mulig."],

}, {
  "id": "nettvett-1",
  "namn": "Nettvett",
  "type": "patrulje",
  "omrader": ["K", "L", "V"],
  "mal": ["K-6", "L-11", "L-2", "V-6"],
  "krav": ["Finn noe du vet om eller kan gjøre på nett som ikke lederne eller en annen voksen kan. Hjelp dem med å lære det.", "Snakk om fordeler og ulemper ved bruk av sosiale medier, og om hvordan de kan påvirke livet vårt og livskvaliteten. Stikkord: relasjoner og samfunnsengasjement, selvbilde og psykisk velvære, læring og personlig utvikling.", "Lær deg å kjenne igjen nettmobbing og lær hva du kan gjøre hvis du opplever/observerer det.", "Lær å kjenne igjen misvisende eller falsk informasjon på nett. Lag en liste med regler som hjelper deg å være forsiktig og kritisk til det du leser/ser og unngå å spre falsk eller negativ informasjon på nett. Snakk om hvordan vi kan bruke sosiale medier til å spre positive budskap og gjøre verden bedre.", "Forstå at hvem som helst kan skjule seg bak en brukerkonto på nett, og lær hvordan du kan håndtere personer du ikke kjenner."],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "nettvett-1",
  "url": "https://speiding.no/speiderprogram/speiderbasen/nettvett-1/"
}, {
  "id": "omtanke-og-rettferdighet",
  "namn": "Omtanke og rettferdighet",
  "type": "patrulje",
  "omrader": ["K", "L", "S"],
  "mal": ["K-15", "L-1", "L-2", "L-6", "S-9"],
  "krav": ["Lag et rollespill med utgangspunkt i fortellingen om den barmhjertige samaritan om en speidersituasjon i dag. Bruk gjerne speiderloven og/eller speiderløftet.", "Finn ut hva rettferdig handel er. Dra til en eller flere matbutikker og finn ut hvilke varer som finnes i rettferdig variant.", "Kjøp inn minst fem rettferdige varer til en patrulje-/tropps-/gruppetur eller leir.", "Lag et måltid for resten av troppen/gruppen som illustrerer hvor skjev matvarefordelingen i verden er i dag.", "(Velg 4 av 3) Patruljen deltar på en leirbålsprat. Snakk sammen om de 4 punktene som patruljen(e) har gjennomført. Hva har de gjort, hvorfor har de gjort det og hvordan har de gjort det? Hva kan man gjøre som speider og patrulje for at andre skal få det bedre? Hvordan er det å bli ulikt behandlet?"],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "omtanke-og-rettferdighet",
  "url": "https://speiding.no/speiderprogram/speiderbasen/omtanke-og-rettferdighet/"
}, {
  "id": "demokrati-ii",
  "namn": "Demokrati II",
  "type": "speider",
  "omrader": ["S"],
  "mal": ["S-1", "S-2"],
  "krav": ["Delta på gruppetingets årsmøte.", "Send inn en sak til gruppetinget og presentere den under møtet.", "Finn ut hva kretsting er. Delta på et kretsting/korpsting som observatør eller delegat.", "Finn ut hva Speiderforum er. Sett deg inn i 2 saker fra forrige eller kommende Speiderforum og diskuter sakene på et patruljemøte eller lignende.", "Hjelp troppsleder eller gruppeleder å lage innkalling til troppsting eller gruppeting.", "Vær ordstyrer på troppsting eller gruppeting.", "Vær referent på troppsting eller gruppeting, og send ut referatet i etterkant.", "Still til valg som gruppas representant til kretsting/korpsting på gruppetinget.", "Still til valg som kretsen/korpsets representant til Speiderforum.", "Bidra til god stemning på kretsting/korpsting ved for eksempel å bake en kake, ta med møtesnacks, lage møtebingo, pauselek eller annet hyggelig innslag."],
  "alderstrinn": "vandrer",

  "uid": "demokrati-ii",

}, {

  "namn": "Demokrati I",
  "type": "patrulje",
  "omrader": ["S"],
  "mal": ["S-1", "S-2"],
  "krav": ["Finn ut hvilke saker som vanligvis behandles på gruppetinget, som budsjett, arbeidsplan, årsrapport, valg eller lignende. På hvilken måte påvirker disse sakene dere?", "Finn ut hva disse begrepene betyr: Ordstyrer, konstituering, referent, tellekorps, alminnelig flertall, valgt ved akklamasjon, protokoll, replikk og innlegg.", "Delta aktivt på troppsting, for eksempel ved å si deres mening i en av sakene som blir tatt opp og delta i avstemningene.", "Forbered en pauseaktivitet til et troppsting eller gruppeting, for eksempel en møtebingo."],
  "alderstrinn": "vandrer",
  "kategori": "lavthengende",
  "uid": "demokrati-i",
  "url": "https://speiding.no/speiderprogram/speiderbasen/demokrati-i/"
}, {
  "id": "vaer-0",
  "namn": "Vær",
  "type": "speider",
  "omrader": ["K", "S"],
  "mal": ["K-3", "S-6"],
  "krav": ["Ta bilde av minst 5 forskjellige skytyper. Lær deg hva som skiller dem fra hverandre, og hva de har å si for været.", "Lær om et værfenomen, for eksempel en tyfon, orkan, nordlys, lyn og tåke. Fortell på en kreativ måte om det du har lært til patruljen din eller resten av troppen.", "Finn ut hva som skiller ekstremvær fra vanlig vær. Ta for deg en konkret situasjon og se på konsekvensene av den.", "Registrer været i 7 dager, og sammenlign det med langtidsvarselet og værmeldingen.", "Finn ut hvilke tiltak du kan gjøre for å sikre et gruppeområde på leir mot ulike værhendelser, for eksempel høy varme, mye nedbør eller sterk vind."],

  "id": "inkludering",
  "namn": "Inkludering",
  "type": "patrulje",
  "omrader": ["S", "V"],
  "mal": ["S-12", "V-12", "V-5", "V-8"],
  "krav": ["Finn ut på hvilke måter dere er forskjellige. Diskuter hvordan dere kan sørge for at alle i patruljen eller troppen har det fint i speideren og bidrar til fellesskapet på sin måte.", "Finn ut hva mangfold betyr og diskuter nye og kreative måter for hvordan gruppa kan bli mer mangfoldig og gi rom for flere. Gjennomfør ideen med gruppa eller troppen.", "Finn ut hva inkludering er. Velg en aktivitet eller et møteforslag fra Speiderbasen og gjennomfør den på en mer inkluderende måte.", "Lag et innlegg på speidergruppa sin hjemmeside eller sosiale medier som på en kreativ måte uttrykker at alle er velkomne i speideren, for eksempel bildecollage, kortfilm for sosiale medier eller lignende."],

  "krav": ["Dykkerteknisk Enten Ha bestått et PADPADI /CMAS eller tilsvarende kurs i fridykking; eller apparatdykking på nivå med PADPADI Jr Open Water Diver eller CMAS *apparatdykker. Eller Kunne sikkerhetsreglene for fridykking med maske og snorkel. Kjenne til hensyn som må tas ved valg av utstyr for fridykking eller apparatdykking. Demonstrere korrekt fridykking i sjø eller basseng.", "Formidling Gjøre 2 av de fem alternativene: Holde et 10 minutters foredrag for patruljen om aktiviteter som dykkerhobbyen kan tilby. Ved hjelp av Internet, litteratur eller lignende holde et lite foredrag for patruljen om et vrak som har en spennende historie, og som det går an å dykke til et eller annet sted i verden. Vise fram og forklare utstyret du bruker til apparat-/fridykking til patruljen. Ta bilder under vann under en dykkertur/ved fridykking. Vis fram bildene på et tropps- eller patruljemøte. Ved hjelp av internett, litteratur eller lignende, holde et lite foredrag for patruljen om den marinbiologi (fisker, dyr, planter o.l.) som finnes i nærmiljøet."],

  "krav": ["Kunne gjøre rede for ti forskjellige hurtigtaster i operativsystemet eller programmet du benytter.", "Kunne redigere, opprettholde og oppdatere en speiderrelatert nettside med tekst og bilder i minst tre måneder. Skikk og bruk og rettigheter ved bruk av bilder og tekst på internett.", "Bruke internett til å finne info om et speiderrelatert tema, skrive en artikkel om dette og legge den ut på nettsiden. Teksten skal dekke cirka en A4-side.", "Kjenne til de viktigste prinsippene for datasikkerhet, backup, beskyttelse mot malware (spyware, adware mm.) og virus. Forklare viktigheten av malware- og viruskontroll. Kunne sjekke at dette fungerer og eventuelt er oppdatert.", "Kunne utforme og sende en e-post med valgfritt program. Vise at man kjenner til skikk og bruk i forbindelse med denne typen korrespondanse og kunne utforme innholdet/oppsettet avhengig av mottaker.", "Internett er et sted der det er enkelt å mobbe noen og lett å slippe unna med det. Hva kan gjøres for å unngå internettmobbing? Diskuter i patruljen.", "Hvordan bruker vi chat-programmer i dag? Hvorfor kan det være lurt å bruke et alias når man snakker med andre? Hva slags opplysninger bør man være forsiktig med å gi fra seg?"],

  "krav": ["Lær om hvordan vi kan unngå å spre smitte til andre, blant annet gjennom god hygiene.", "Lær deg å vaske hendene riktig med såpe og vann, og øv deg på å huske å gjøre det når du kommer hjem, når du har vært på do, før du skal spise eller lage mat og når du skal møte noen andre.", "Tegn en hyggelig tegning til noen som er ensom eller kjeder seg hjemme. Husk hygienereglene når du arbeider!", "Bruk kroppen aktivt minst én time hver dag og minst to timer hver dag i helgen, aller helst ute, i minst én uke.", "Prøv ut en aktivitet sammen med en venn hvor dere ikke er i nærheten av hverandre.", "Lær hva en epidemi og en pandemi er, og lær om hvordan vi holder oss selv friske og unngår å smitte andre, for eksempel gjennom god hygiene, karantene og stenging av offentlig steder og arrangementer.", "Lær deg å vaske hendene riktig med såpe og vann, og venn deg til å gjøre det når du kommer hjem, når du har vært på do, før du skal spise eller lage mat og når du skal møte noen andre.", "Lag pynt eller noe annet som kan gis til noen som er i karantene. Husk hygienereglene når du arbeider!", "Prøv ut to-tre nye fysiske aktiviteter, og gjennomfør dem i minst én time hver dag, inne eller ute, i minst én uke.", "Ha flere aktiviteter sammen med en venn eller noen i familien uten at dere er nære hverandre, for eksempel på telefon, videosamtale eller lignende.", "Lær om smittevern og karantene.", "Praktiser de vanlige anbefalingene for å unngå smittespredning, som håndvask, bruk av lommetørkle og vise hensyn ved hosting og nysing, holde god avstand med mer.", "Finn ut hvordan du kan gjøre dagen hyggeligere for familiemedlemmene som må holde seg hjemme over lang tid, og gjør det.", "Gå, sykle, padle eller liknende til et nytt sted hver dag eller studér forandringene i naturen, ta naturbilder eller liknende i minst én uke.Hvis du ikke kan gå ut, gjør noe aktivt og nyttig inne.", "Legg ut noe oppmuntrende på sosiale medier. Praktiser nettvett og medievett: vær en god venn på nettet, vær kildekritisk og tenk over hva du deler.", "Skriv dagbok om hva du har opplevd, gjort og tenkt i løpet av dagen. Ta med både positive og negative ting.", "Lær hvordan epidemier og pandemier utvikler seg, og hvordan utviklingen kan forebygges eller forsinkes. Lær om karantene reglene og pass på at du og de rundt deg respekterer dem.", "Praktiser de vanlige hygienerådene for å unngå smittespredning.", "Legg ut noe oppmuntrende på sosiale medier. Vis ro og vær en god venn og et godt forbilde, også på nettet. Tenk nettvett og medievett når du ser etter informasjon om pandemien på nett. Vurder hva du deler, og still kildekritiske spørsmål (hvem, hvorfor, hvordan, når og kilder).", "Hold deg i aktivitet og prøv å oppleve noe nytt hver dag. Vær ute minst en time hver dag, og lenger på fridager. Hvis du ikke kan gå ut, gjør noe aktivt inne.", "Meld deg til tjeneste i forbindelse med korona-tiltak i Speidernes beredskap eller sammen med roverlaget eller med egen speidergruppe/krets, gjerne i samarbeid med kommunen eller andre frivillige eller offentlige aktører.", "Finn ut hvordan speidergruppa di kan bidra aktivt i korona-dugnaden, og arbeid for å få dette til.", "Snakk jevnlig med noen du ikke snakker med så ofte på telefon, videosamtale eller lignende.", "Skriv dagbok og beskriv hva du opplever rundt deg, og hva du har gjort og tenkt i løpet av dagen. Dette vil være interessant når krisa er over, både for deg og etterkommerne dine og for dem som skal forske på samfunnets respons."],

  "krav": ["Lag en CV med personlige evner og egenskaper som gir deg respekt for deg selv, og bruk CV-en til å overbevise patruljen om å gi deg ansvar for en konkret oppgave.", "Lag en collage/fotoalbum/video som sammenlikner kroppsbildet og skjønnhetsidealer verden rundt og forandringer i dem gjennom tidene.", "Lag en utstilling med alle patruljemedlemmenes rollemodeller. Snakk om hva som gjør dem til rollemodeller, og hvordan de påvirker patruljemedlemmenes oppførsel og selvfølelse, det vil si om de er positive rollemodeller.", "Diskuter om det finnes likhetspress/vennepress i speideren og på skolen.", "Lag en plakat som illustrerer alt dere forbinder med forelskelse og kjæresteforhold, og diskuter om det finnes en nedre/øvre aldersgrense for de forskjellige følelsene og handlingene. Når er disse handlingene greie, og når er de krenkende?", "Delta i et rollespill om flørting eller vennegjeng, hvor gutter spiller jenter og omvendt, og prøv å herme etter den typiske jente-/gutteoppførselen. Snakk etterpå om hvordan dere opplevde det.", "Her finner du opplegg til hvordan man kan gjennomføre en økt der speiderne lager en personlig CV https://speiding.no/speiderprogram/speiderbasen/personlig-cv/ Finn frem et ark til hvert patruljemedlem. Hvert patruljemedlem skriver navnet sitt stort midt på arket. Begynn med å sende arket til personen som sitter til høyre for deg. Sett frem en stoppeklokke og la alle få 1min til å skrive ned positive personlige evner og egenskaper om speideren som står på arket. Når det har gått 1min sender dere arket på nytt til høyre. Fortsett slik til alle har fått arket sitt tilbake. Er det noen forskjell i hvordan du opplever deg, kontra hvordan patruljemedlemmene oppfatter deg?", "Her finner dere noen relevante påstander man kan se på som kan gi noen tips til hvor man kan begynne å lete https://speiding.no/speiderprogramspeiderbasen/myten-om-kroppsidealet-rover", "Skriv ut eller tegn forbildene deres og skriv noen stikkord på baksiden av tegningen. Heng de gjerne opp på patruljerommet!", "Bruk gjerne denne aktiviteten som oppvarming til å diskutere venne/likhetspress; https://speiding.no/speiderprogram/speiderbasen/god-venn-skattejakt. Deretter kan dere sammen finne ut av hvordan dere raskt kan «slå ned» på slengkommentarer som andre måtte komme med og som kan føre til press blant ungdom. Ta gjerne utgangspunkt i denne aktiviteten; https://speiding.no/speiderprogram/speiderbasen/si-ifra", "Bruk en stor plakat, slik at alle kan skrive tanker på den. Er patruljen stor, kan det være lurt å lage to. Kanskje en rover eller speiderleder kan hjelpe dere i gang med diskusjonen og veilede dere om dere synes det er litt vanskelig?", "Rollespill er en super måte å se ting fra en annens synspunkt! Lykke til."],

  "krav": ["Vis at du kan skru av og på, stille inn riktig kanal og justere volum på PMR-radioen.", "Vis at du kan bytte eller lade batterier, og at du vet hva som passer for de batteriene din radio har.", "Vis at du kan holde PMR-radioen tørr i vind og regn.", "Vis og forklar hva som skjer dersom to radioer sender på samme kanal samtidig.", "Lær det fonetiske alfabetet og bruk dette til å stave hverandres fornavn via PMR-radio.", "Vis at du kjenner Q-kodene QRX, QTH og QSY og kan bruke disse riktig via PMR-radio.", "Vis at du kan bruke ordene GJENTA, JEG-BOKSTAVERER og TALLTEGN via PMR-radio.", "(Velg 1 av 5) Gjennomfør minst to av disse punktene: Delta med PMR-radioer i et orienteringsløp eller en skattejakt for patruljen. Den ene delen av patruljen ser postene eller skatten på et kart, og instruerer den andre delen av patruljen i å finne fram. Formidle en strektegning, en bokstav i blindeskrift eller døveskrift, et symbol, en dansebevegelse eller lignende via PMR-radio. Resten av patruljen skal tegne, gjette eller gjenta det som er forklart. Kontakt en radioamatør og lær om likheter og forskjeller mellom amatørradio og PMR-radio. Hvor stopper egentlig radiobølgene? Sammenlikn. Bruk PMR-radio til å formidle en nødmelding på en førstehjelpsøvelse i troppen. Finn ut hvordan radiosignaler kan rekke kanskje tusenvis av kilometer til speidere i andre land, eller fra en dal til en annen i landet vårt. Spør gjerne en radioamatør om å få prøve forskjellige amatørradiobånd i forbindelse med JOTA."],

  "krav": ["Lær om speiderbevegelsens historie internasjonalt, i Norge og lokalt.Finn ut litt om WAGGGS og WOSM.", "Finn ut hvilke verdensspeidersentre som finnes og fortell om disse til patruljen.", "Samle noen fakta, bilder og tegninger som forteller om Lord og Lady Baden-Powells liv og noen sitater av Baden-Powell. Finn ut hva speiderideen er, og hva alle speidere har felles.", "Lær deg sangen \"Lord Baden-Powell i England satt\".", "Kontakt en speiderleder og be ham eller henne fortelle om speiderarbeidet for noen år siden. Hva er annerledes i dag? Hvorfor tror du det er skjedd forandringer?"],

  "krav": ["Slå opp Bibelen og les misjonsbefalingen.", "Gå inn på nettsiden til en misjonsorganisasjon og finn navn og adresse til noen misjonærer. Send dem en e-post hvor du forteller litt om speiderpatruljen din, og be om informasjon om en misjonærs arbeidsdag og livet på misjonsfeltet. Spør også om informasjon om speiderarbeidet i landet hvis det er speiding der.", "Fortell om misjonsfeltet og tegn et kart over det.", "Fortell om en misjonsorganisasjon og hvor den driver sitt arbeid."],

  "krav": ["Bli kjent med ditt (eller et kristent) trossamfunn. (Historie, utbredelse )", "Lær trosbekjennelsen og Fader vår og finn ut hva ditt trossamfunn legger i dåp og nattverd.", "Gjør deg kjent med innholdet i de 10 bud, og med \"Den gyldne regel\". Diskuter med andre hvordan vi skal leve sammen. Bruk aktuelle problemstillinger fra nærmiljø og samfunnsdebatt."],

  "krav": ["(Velg 4 av 8) Gjør minst fire av disse oppgavene: Puss sølvtøy eller vinduer. Støvsug og vis at du kan tømme støvsugeren. Lag frokost, rydd etter frokosten og vask opp på en patruljetur. Vask en ullgenser eller stryk en bluse eller skjorte. Vær med å vaske speiderhytta. Hold god orden på rommet ditt minst en måned. Vær med på storrengjøring hjemme Vise at du kan bruke strykejern", "Vis at du kan sortere klesvask riktig (farger, ulike stoff o.l.).", "Ta ansvar for riktig sortering av søppel hjemme.", "Rydde ut av sekken etter en tur.", "Vis at du holder speiderskjorta ren og ordentlig."],

  "id": "idrett",
  "namn": "Idrett",
  "type": "speider",
  "omrader": ["K", "L"],
  "mal": ["K-1", "L-10"],
  "krav": ["(Velg 2 av 5) Tilfredsstill kravene til minst to av disse idrettsgrenene: Svømming: - svøm minst 100 meter bryst og 50 meter rygg. - vis at du kan dykke til 2 meters dyp - vis at du kan hoppe eller stupe fra 2 meters høyde. Roing: - vis at du kan svømme 25 meter - vis at du kan ro alene og sammen med en annen - vis at du kan skåte og snu. - vis at du kan legge til en brygge og fortøye båten med ordentlige knuter. Skøyter: - vis at du kan gå 1 km på skøyter. - vis at du kan gå minst 15 meter baklengs på skøyter Ski: - gå til sammen 50 km på ski i løpet av vinteren - vis at du kan hoppe 5 meter på ski - vis parallellsving (slalåmsving) og telemarksving Sykkel: - vis at du kan sykle 8 km på 30 min, eller vær med i et sykkelritt. - sykle minst 40 mil i løpet av sykkelsesongen", "(Velg 2 av 6) Velg to av disse punktene: Vær med i et volleyballspill eller basketballspill og vis at du kjenner reglene for spillet. Spill minst tre fotballkamper og lær reglene. Spill minst to håndballkamper og lær reglene. Fortell hva overtrening kan føre til. Vær med i et O-løp eller terrengløp på minst 3 km. Ta et idrettsmerke eller svømmemerke"],

  "omrader": ["K"],
  "mal": ["K-7", "K-8", "K-9"],
  "krav": ["Lag minst to eksempler på plantefarging og forklar hvordan dere går fram. Lag en nyttegjenstand til patruljen, gruppen eller speiderhytta.", "Vit hva batikk er og fortell hva som trengs av utstyr for å lage noe i batikk. Prøv dere på minst en batikkmåte. Lag noe dere kan ha glede og nytte av senere (t-skjorte, duk, bestikkpose eller lignende).", "Vis eksempler på noe som er laget i stofftrykk. Lag minst to ting til patruljen, troppen, patrulje- eller troppsrommet eller speiderhytta.", "Lag patruljesærpreg, fotposer eller leirbålskappe e.l."],

  "id": "brannvern",

  "type": "patrulje",
  "omrader": ["F", "K"],
  "mal": ["F-11", "F-12", "K-2", "K-4"],
  "krav": ["Antenning: Forklar hva som må til for at det skal bli ild. Fortell om hva som kan stoppe eller begrense ilden, og om hva som gjør at det brenner fortere.", "Virkning: Forklar hvordan ild og røyk kan ødelegge materiell og drepe mennesker.", "Slukking: Forklar hvordan man slokker ild i treverk, skogbunn, trær, telt og brennbare væsker. Vis slokking med bøtte, slange, ullteppe, jakke og brannslukkingsapparat.", "Varsling: Demonstrer korrekt varsling av brannvesenet (simulert). Vit når man ringer nødnummeret 110. Vit hvordan automatisk brannvarsling virker.", "Redning: Vis riktig gang i stige, og vit hvordan en redningsstige løses ut. Vis nedfiring i tau og opptreden i røykfullt rom. Vis løfting, bæring og sleping av innesperrede og bevisstløse personer.", "Evakuering: Gjennomfør en evakueringsøvelse på speiderlokalet. Avtal møteplass på forhånd og gjennomfør en opptelling når dere har kommet ut. Diskuter hvordan man skal forholde seg hvis noen mangler.", "Forebygging: Vit hva et branntilsyn er og hva det omfatter. Nevn minst fem vanlige brannårsaker og fortell hvordan de kan forebygges. Kjenn til reglene for oppbevaring av gass og brennbare væsker og forklar hva som kan skje hvis disse ikke overholdes. Forklar hva selvantenning og kortslutning er, og fortell hva uforsiktig bruk av ildsfarlige væsker kan føre til.", "Branntilsyn: Finn potensielle brannårsaker i speiderlokalet og diskuter om disse kan forebygges. Test røykvarsler og demonstrer skifte av batteri. Vis kontroll og vedlikehold av brannslukkingsapparat."],
  "alderstrinn": "vandrer",
  "kategori": "mote",
  "uid": "brannvern",
  "url": "https://speiding.no/speiderprogram/speiderbasen/brannvern/"
}, {

  "krav": ["(Velg 2 av 6) Dramatiser to av disse punktene med miming, musikk, masker, opplesninger eller noe annet: et punkt fra speiderloven legenden om St.Georg en god historie eller et sagn et folkeeventyr en sketsj en episode fra dagliglivet.", "Fremfør en minirevy for resten av troppen eller delta i en større revyoppsetning. Tema og tekster må dere i samarbeid finne og velge ut.", "Arranger teatersport for resten troppen eller gruppen. Dere bestemmer rammene (f.eks begrensninger i forhold til tid og rom, til for eksempel at man må snakke på rim, synge, ikke bruke bokstaven S osv)."],

  "krav": ["(Velg 2 av 5) Gjennomfør minst to av disse: Bruk samband aktivt på en tur. Kjenn vilkårene for å eie privat radioutstyr (walkie talkie). Kjenn de nødsignaler som brukes mest i radiotelegrafi og telefoni, og vit hvordan disse brukes. Vis at du behersker bruk av e-post. Lek med semafor på en tur, og forsøk å sende meldinger til hverandre. Kjenn de mest brukte \"bakke til luft\" signalene, og vit hvordan disse lages i terrenget.", "Lær dere nettvettreglene og diskuter disse i patruljen.", "Lag en veggavis, lysbildeserie eller lignende som beskriver en del viktige former for kommunikasjon i ulike deler av verden (f.eks. aviser, blader, radio, TV, telefax, Internett, telefon, mobiltelefon). Diskuter ulikhetene.", "Arranger et besøk hos en avisredaksjon eller en radiostasjon eller inviter dem til å besøke dere på et patrulje- eller troppsmøte for å informere om sin virksomhet.", "Diskuter og skriv ned patruljens etiske regler for bruk av SMS, MMS og e-post."],

  "krav": ["Fortell om elektrisitet og de vanlige måleenhetene (volt, ampere, ohm og watt). Forklar hvorfor spenningsførende ledninger må isoleres.", "Finn ut hva elektrisk strøm koster der du bor.", "Finn hovedbryteren i huset der du bor og lær å slå den av.", "Tegn og forklar en strømkrets med sikringselement, stikkontakt, bryter og lampeholder.", "(Velg 2 av 6) Gjør to av disse punktene: Forklar hvordan en akkumulator er bygget opp og hvordan den virker Forklar hva kortslutning og overledning er. Forklar hvordan en sikring virker og hva slags stell den skal ha. Skift sikringer og lyspærer og vit hvor sterke de skal være. Vis forsiktighetsreglene ved bruk av elektriske apparater. Lær å lodde. Lag en elektromagnet og kople den til en strømkilde."],

  "krav": ["Vær aktivt med på en JOTA/JOTI.", "Gjennomfør minst 6 QSO-er (samtaler) og skriv logg og QSL-kort for dem. En av QSO-ene skal være en stasjon utenfor Norge.", "Lær det fonetiske alfabet og bokstaver ditt eget navn.", "Lær minst 6 av de mest brukte Q-kodene.", "Kjenn til speiderfrekvensene i amatørradiobåndene, og kjenn til vanlig rekkevidde for disse frekvensene.", "Vær med på minst to JOTA/JOTI-aktiviteter utenom radio og nettprat. Det kan være internasjonal mat, radiopeileorientering eller noe annet.", "Oppnå kontakt med speidere i andre land på Internett."],

  "omrader": ["K"],
  "mal": ["K-1", "K-10", "K-2", "K-3"],
  "krav": ["Fortell om minst seks forskjellige tautyper.", "Vis og fortell om minst to forskjellige typer plantefibertau. Forklar hva de brukes til.", "Vis og fortell om minst to forskjellige typer kunstfibertau. Forklar hva de brukes til.", "Forklar fordelene plantefibertau har framfor kunstfibertau og omvendt.", "Forklar betegnelsene \"line\" og \"garn\".", "Lag en båre med stokker og livline.", "Lag en knutetavle med minst 15 knuter og vis hvordan de brukes.", "(Velg 1 av 4) Instruer resten av patruljen i et av følgende: Lage en speiderknute (tyrkerknop) Lage en kortspleis Lage en endespleis Lage en takling"],

  "krav": ["Lag en knutetavle med minst åtte knuter og forklar når de brukes.", "Slå seks knuter. Vis hvordan og når de brukes.", "Forklar forskjellen på tre forskjellige typer tau. Fortell hvordan de skal oppbevares."],

  "id": "leirbal",

  "type": "patrulje",
  "omrader": ["K", "S", "V"],
  "mal": ["K-14", "K-2", "S-3", "V-9"],
  "krav": ["Lag et leirbålsprogram og gjennomfør det på en tropps- eller gruppetur.", "Lær dere minst to nye speidersanger og to nye leirbålssanger. Lag minst ett leirbålsrop. Lær det videre til andre speidere.", "Øv inn minst tre leirbålsleker eller leirbålskonkurranser. Lær dem videre på et leirbål.", "Sett i stand en leirbålsplass og ta ansvaret for gjennomføringen av det tekniske arrangementet av et lite leirbål, også opprydning etterpå.", "Diskuter god leirbålsskikk (eks. brenning av søppel, respekt for bålet o.l.)."],
  "alderstrinn": "vandrer",
